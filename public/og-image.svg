    <text x="44" y="338" font-family="Arial" font-size="13" fill="#64748b">CGST + SGST</text>
    <text x="336" y="338" font-family="Arial" font-size="13" fill="#0f172a">Rs 2,268</text>

    <text x="28" y="392" font-family="Arial" font-size="13" fill="#64748b">Total payable</text>
    <text x="248" y="396" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Rs 14,867</text>

    <rect x="28" y="420" width="384" height="36" rx="10" fill="#ecfdf5"/>
    <text x="220" y="443" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#047857">UPI collected  |  WhatsApp shared</text>
