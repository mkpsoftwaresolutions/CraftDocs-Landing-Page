    <text x="0" y="198" font-family="Arial" font-size="18" fill="#cbd5e1">Chat with Inky AI to create GST invoices, quotations,</text>
    <text x="0" y="224" font-family="Arial" font-size="18" fill="#cbd5e1">and challans - then share on WhatsApp and collect via UPI.</text>

