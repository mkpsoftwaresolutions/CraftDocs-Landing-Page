    <rect x="28" y="210" width="384" height="12" fill="#f1f5f9"/>
    <text x="44" y="211" font-family="Arial" font-size="11" font-weight="700" fill="#64748b">ITEM</text>
    <text x="268" y="211" font-family="Arial" font-size="11" font-weight="700" fill="#64748b">HSN</text>
    <text x="348" y="211" font-family="Arial" font-size="11" font-weight="700" fill="#64748b">AMOUNT</text>

    <text x="44" y="250" font-family="Arial" font-size="14" fill="#0f172a">Brand design sprint</text>
    <text x="268" y="250" font-family="Arial" font-size="13" fill="#64748b">998311</text>
    <text x="348" y="250" font-family="Arial" font-size="14" font-weight="700" fill="#0f172a">Rs 12,000</text>

    <text x="44" y="286" font-family="Arial" font-size="14" fill="#0f172a">CraftDocs Pro</text>
    <text x="268" y="286" font-family="Arial" font-size="13" fill="#64748b">998313</text>
    <text x="352" y="286" font-family="Arial" font-size="14" font-weight="700" fill="#0f172a">Rs 599</text>

