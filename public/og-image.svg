<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CraftDocs GST Invoice Software for India">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#0d1730"/>
    </linearGradient>
    <radialGradient id="glowL" cx="18%" cy="30%" r="42%">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#070b18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="82%" cy="70%" r="46%">
